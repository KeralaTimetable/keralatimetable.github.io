<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="cPHgzg8741NBFQ5HszgVIPA3EMrKJLlj7IHcyLGM2Lo" />
    
    <title>Login | Kerala Timetable Student Portal</title>
    
    <meta name="description" content="Log in to your Kerala Timetable account to access personalized study materials, save your progress, and get tailored KTU updates.">
    <meta name="robots" content="noindex, nofollow">
    
    <script src="/tailwind-local.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        
        .bg-mesh { background-color: #f1f5f9; }

        /* Authentic Glassmorphism */
        .real-glass {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            border-left: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 16px 40px 0 rgba(31, 38, 135, 0.15);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* Inner glass for inputs */
        .inner-glass {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .inner-glass:focus {
            background: #ffffff;
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        /* Orb Animation */
        @keyframes float-pulse {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.6; }
        }
        .orb-pulse { animation: float-pulse 6s ease-in-out infinite; }
        
        @keyframes fadeUpEntry {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { opacity: 0; animation: fadeUpEntry 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>

<body class="bg-mesh text-slate-800 antialiased flex flex-col min-h-screen relative">

    <div id="navigation-container" class="relative z-50"></div>

    <!-- Floating Orbs Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-10 -left-20 md:top-20 md:-left-10 w-72 h-72 md:w-96 md:h-96 transition-transform duration-100 ease-out">
            <div id="mouse-orb-1" class="w-full h-full bg-indigo-400 rounded-full mix-blend-multiply filter blur-[70px] md:blur-[80px] orb-pulse transition-transform duration-100 ease-out"></div>
        </div>
        <div class="absolute bottom-10 -right-20 md:bottom-20 md:-right-10 w-80 h-80 md:w-[30rem] md:h-[30rem] transition-transform duration-100 ease-out">
            <div id="mouse-orb-2" class="w-full h-full bg-purple-400 rounded-full mix-blend-multiply filter blur-[80px] md:blur-[100px] orb-pulse transition-transform duration-100 ease-out" style="animation-delay: 2s;"></div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center w-full px-4 py-12 relative z-10 perspective-1000" style="perspective: 1000px;">
        
        <div id="glass-card" class="real-glass rounded-[2rem] p-8 md:p-10 w-full max-w-md animate-fade-up">
            <div style="transform: translateZ(30px);">
                
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-14 h-14 bg-white/80 backdrop-blur-md rounded-2xl mb-4 text-indigo-600 shadow-[0_4px_20px_rgba(79,70,229,0.15)] border border-white">
                        <i class="fas fa-fingerprint text-2xl"></i>
                    </div>
                    <h1 class="text-3xl font-black text-slate-900 tracking-tight">Welcome Back</h1>
                    <p class="text-slate-500 font-medium text-sm mt-1">Sign in to access your personalized hub.</p>
                </div>

                <!-- Google Auth Button (ID ADDED) -->
                <button id="google-login-btn" class="w-full bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold py-3.5 px-6 rounded-2xl shadow-sm transition-all transform hover:-translate-y-0.5 active:scale-95 flex items-center justify-center gap-3">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
                    Continue with Google
                </button>

                <!-- Divider -->
                <div class="flex items-center gap-3 my-6 opacity-60">
                    <div class="h-px bg-slate-400 flex-grow"></div>
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Or login with email</span>
                    <div class="h-px bg-slate-400 flex-grow"></div>
                </div>

                <!-- Email Form -->
                <form class="space-y-4" onsubmit="event.preventDefault(); alert('Email login is currently under construction. Please use Google Sign-In.');">
                    <div>
                        <label class="block text-[11px] font-black text-slate-600 uppercase tracking-wider mb-2 ml-1">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                <i class="fas fa-envelope text-sm"></i>
                            </div>
                            <input type="email" placeholder="student@college.edu" class="inner-glass w-full text-slate-800 font-semibold text-sm rounded-2xl pl-10 pr-4 py-3.5">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2 ml-1 pr-1">
                            <label class="text-[11px] font-black text-slate-600 uppercase tracking-wider">Password</label>
                            <a href="#" class="text-[10px] font-bold text-indigo-600 hover:text-indigo-700 hover:underline">Forgot?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                <i class="fas fa-lock text-sm"></i>
                            </div>
                            <input type="password" placeholder="••••••••" class="inner-glass w-full text-slate-800 font-semibold text-sm rounded-2xl pl-10 pr-4 py-3.5">
                        </div>
                    </div>

                    <button type="submit" class="w-full mt-6 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-[0_8px_20px_rgba(79,70,229,0.3)] transform transition hover:scale-[1.02] flex items-center justify-center gap-2">
                        Log In <i class="fas fa-arrow-right text-xs"></i>
                    </button>
                </form>
                
                <p class="text-center text-xs text-slate-500 font-medium mt-6">
                    Don't have an account? <a href="#" class="text-indigo-600 font-bold hover:underline">Sign up for free</a>
                </p>

            </div>
        </div>

    </main>

    <footer class="mt-auto border-t border-slate-200/60 bg-white/50 py-6 text-center relative z-10">
        <div class="max-w-3xl mx-auto px-4">
            <p class="text-slate-400 text-xs font-medium">Kerala Timetable Student Portal. Secure & Encrypted.</p>
        </div>
    </footer>

    <script src="/components.js?v=14"></script>
    
    <!-- UI Scripts (Navigation & Parallax) -->
    <script>
        if(typeof loadNavigation === 'function') loadNavigation('', '/', false);

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2; 
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            applyParallax(x, y);
        });

        document.addEventListener('mouseleave', () => {
            applyParallax(0, 0);
        });

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if(e.gamma === null || e.beta === null) return;
                let x = e.gamma / 40; 
                let y = (e.beta - 45) / 40; 
                x = Math.max(-1, Math.min(1, x));
                y = Math.max(-1, Math.min(1, y));
                applyParallax(x, y);
            }, true);
        }

        function applyParallax(x, y) {
            const mouseOrb1 = document.getElementById('mouse-orb-1');
            const mouseOrb2 = document.getElementById('mouse-orb-2');
            
            if(mouseOrb1) mouseOrb1.style.transform = `translate(${x * -30}px, ${y * -30}px)`;
            if(mouseOrb2) mouseOrb2.style.transform = `translate(${x * 40}px, ${y * 40}px)`;

            const glassCard = document.getElementById('glass-card');
            if(glassCard) {
                glassCard.style.transform = `perspective(1000px) rotateX(${y * -4}deg) rotateY(${x * 4}deg)`;
            }
        }
    </script>

    <!-- Firebase SDK & Auth Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQQdEQPqHebt9QCDzWIvZdRUk0g-2dCLs",
            authDomain: "kerala-timetable-db.firebaseapp.com",
            databaseURL: "https://kerala-timetable-db-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kerala-timetable-db",
            storageBucket: "kerala-timetable-db.firebasestorage.app",
            messagingSenderId: "527439836518",
            appId: "1:527439836518:web:af7725a5bf07d6a4f584a7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const googleBtn = document.getElementById('google-login-btn');
        
        googleBtn.addEventListener('click', async () => {
            const originalText = googleBtn.innerHTML;
            googleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            googleBtn.disabled = true;

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                console.log("Success! Logged in as:", user.displayName);
                
                // Redirect the user to the homepage
                window.location.href = "/index.html"; 
                
            } catch (error) {
                console.error("Error during login:", error.message);
                alert("Login failed. Please try again.");
                
                googleBtn.innerHTML = originalText;
                googleBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
