<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Page Not Found (404) | Kerala Timetable</title>
    <meta name="robots" content="noindex, follow">
    
    <link rel="canonical" href="https://keralatimetable.in/404.html" />
    <link rel="icon" href="https://keralatimetable.in/favicon.png" type="image/png">

    <script src="/tailwind-local.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .bg-mesh { background-color: #f8fafc; }
        
        .real-glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            border-left: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 16px 40px 0 rgba(31, 38, 135, 0.1);
        }

        @keyframes float-pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 0.5; }
        }
        .orb-pulse { animation: float-pulse 7s ease-in-out infinite; }
    </style>
</head>

<body class="bg-mesh text-slate-800 antialiased flex flex-col min-h-screen relative">

    <div id="navigation-container" class="z-50 relative"></div>

    <!-- Background Orbs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div id="scroll-bg-1" class="absolute -top-4 -left-8 md:top-10 md:-left-10 w-64 h-64 md:w-96 md:h-96 transition-transform duration-100 ease-out">
            <div id="mouse-orb-1" class="w-full h-full bg-amber-400/60 md:bg-amber-400 rounded-full mix-blend-multiply filter blur-[60px] md:blur-[90px] orb-pulse transition-transform duration-100 ease-out"></div>
        </div>
        <div id="scroll-bg-2" class="absolute top-[40%] -right-8 md:top-80 md:-right-20 w-64 h-64 md:w-[30rem] md:h-[30rem] transition-transform duration-100 ease-out">
            <div id="mouse-orb-2" class="w-full h-full bg-indigo-500/50 md:bg-indigo-500 rounded-full mix-blend-multiply filter blur-[60px] md:blur-[100px] orb-pulse transition-transform duration-100 ease-out" style="animation-delay: 2s;"></div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow max-w-2xl mx-auto px-4 py-16 md:py-24 w-full relative z-10 flex flex-col items-center justify-center text-center">
        
        <div class="real-glass rounded-[2.5rem] p-8 md:p-12 w-full shadow-lg relative overflow-hidden">
            
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-rose-100 rounded-full blur-3xl opacity-60 pointer-events-none"></div>

            <div class="w-20 h-20 bg-rose-50 text-rose-500 rounded-3xl flex items-center justify-center text-3xl mx-auto mb-6 shadow-sm border border-rose-100">
                <i class="fas fa-ghost"></i>
            </div>

            <span class="inline-block px-3 py-1 bg-rose-50 text-rose-600 text-[10px] font-black rounded-lg uppercase tracking-widest border border-rose-100 mb-4">
                Error 404
            </span>

            <h1 class="text-3xl md:text-4xl font-black text-slate-900 tracking-tight mb-4">
                Page not found
            </h1>

            <p class="text-slate-500 text-sm md:text-base font-medium mb-8 leading-relaxed max-w-md mx-auto">
                Oops! The page or notes you are looking for might have been moved, renamed, or doesn't exist yet in the database.
            </p>

            <div class="flex flex-col sm:flex-row justify-center gap-3">
                <a href="/" class="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-2xl shadow-[0_4px_15px_rgba(79,70,229,0.3)] transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                
                <a href="/pyq.html" class="px-6 py-3.5 bg-white/80 hover:bg-white text-slate-700 border border-slate-200 font-bold text-sm rounded-2xl transition-all shadow-sm flex items-center justify-center gap-2">
                    <i class="fas fa-search text-slate-400"></i> Search PYQs
                </a>
            </div>

        </div>

    </main>

    <footer class="mt-auto border-t border-slate-200/60 bg-white/50 py-8 text-center relative z-10">
        <div class="max-w-3xl mx-auto px-4">
            <h3 class="text-slate-800 font-black text-lg mb-1">Kerala Timetable</h3>
            <p class="text-slate-500 font-medium text-sm">Independent student platform for KTU updates & tools.</p>
        </div>
    </footer>

    <script src="/components.js"></script>
    <script>
        if(typeof loadNavigation === 'function') loadNavigation('', '', false);
    </script>
</body>
</html>
