name: Build KTU 2024 S3-S8 Syllabus PDFs & JSON

on:
  push:
    paths:
      - "raw-syllabus/s3-s8/**"
      - "scripts/build_s3_s8_syllabus.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-s3-s8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyMuPDF
        run: pip install pymupdf

      - name: Split S3-S8 PDFs & Build Branch JSONs
        run: python scripts/build_s3_s8_syllabus.py

      - name: Show QA Summary
        run: tail -n 60 syllabus/s3-s8/build_report.txt

      - name: Commit & Push Generated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add syllabus/s3-s8/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build KTU 2024 S3-S8 syllabus PDFs and JSON indices"
            git push
          fi
