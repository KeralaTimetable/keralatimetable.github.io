name: KTU DSpace to Hugging Face Sync

on:
  schedule:
    # Runs automatically every night at 2:00 AM UTC
    - cron: '0 2 * * *' 
  workflow_dispatch:

jobs:
  sync-pdfs:
    runs-on: ubuntu-24.04 # Pinned to avoid migration warnings
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5 # Updated from v4

      - name: Set up Python
        uses: actions/setup-python@v6 # Updated from v5
        with:
          python-version: '3.12' # Upgraded from 3.10 (optional)

      - name: Install Dependencies
        run: |
          pip install requests huggingface_hub urllib3

      # Uncommented so it looks for new papers before syncing
      - name: Harvest latest papers from JEC
        run: python ktu_repo.py harvest

      - name: Sync PDFs to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_WRITE_TOKEN }} 
        run: python hf_sync.py
