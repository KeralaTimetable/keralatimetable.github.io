name: Build KTU 2024 First Year Syllabus PDFs

on:
  push:
    paths:
      - 'raw-syllabus/*.pdf'
      - 'scripts/build_first_year_syllabus.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-syllabus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyMuPDF
        run: pip install pymupdf

      - name: Run Syllabus Splitter
        run: python scripts/build_first_year_syllabus.py

      - name: Show Build Report
        run: cat syllabus/build_report.txt

      - name: Commit Split PDFs & JSON Index
        run: |
          git config user.name "KeralaTimetable Bot"
          git config user.email "bot@keralatimetable.in"
          git add syllabus/
          git diff --staged --quiet || git commit -m "Build KTU 2024 First Year split syllabus PDFs & index"
          git push
