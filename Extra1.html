<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Online Python Compiler (UCEST105) | Kerala Timetable</title>
    <meta name="description" content="Free online Python compiler for KTU S1 students. Practice UCEST105 lab exercises and algorithms directly in your browser without any installation.">
    <meta name="keywords" content="ktu python compiler online, ucest105 python ide, run python in browser, ktu python practice">
    
    <link rel="canonical" href="https://keralatimetable.in/compiler.html" />
    <link rel="icon" href="https://keralatimetable.in/favicon.png" type="image/png">

    <!-- Pyodide WASM Engine -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>

    <script src="/tailwind-local.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .bg-mesh { background-color: #f8fafc; }
        
        .real-glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            border-left: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 16px 40px 0 rgba(31, 38, 135, 0.1);
        }

        .dark-terminal {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .code-textarea {
            font-family: 'Fira Code', monospace;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            resize: none;
            tab-size: 4;
        }
        .code-textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .terminal-output {
            font-family: 'Fira Code', monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }

        select.custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23475569%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
        }

        @keyframes float-pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 0.5; }
        }
        .orb-pulse { animation: float-pulse 7s ease-in-out infinite; }
    </style>
</head>

<body class="bg-mesh text-slate-800 antialiased flex flex-col min-h-screen relative">

    <div id="navigation-container" class="z-50 relative"></div>

    <!-- Background Orbs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div id="scroll-bg-1" class="absolute -top-4 -left-8 md:top-10 md:-left-10 w-64 h-64 md:w-96 md:h-96 transition-transform duration-100 ease-out">
            <div id="mouse-orb-1" class="w-full h-full bg-amber-400/60 md:bg-amber-400 rounded-full mix-blend-multiply filter blur-[60px] md:blur-[90px] orb-pulse transition-transform duration-100 ease-out"></div>
        </div>
        <div id="scroll-bg-2" class="absolute top-[40%] -right-8 md:top-80 md:-right-20 w-64 h-64 md:w-[30rem] md:h-[30rem] transition-transform duration-100 ease-out">
            <div id="mouse-orb-2" class="w-full h-full bg-indigo-500/50 md:bg-indigo-500 rounded-full mix-blend-multiply filter blur-[60px] md:blur-[100px] orb-pulse transition-transform duration-100 ease-out" style="animation-delay: 2s;"></div>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-[1400px] mx-auto px-4 py-8 w-full relative z-10">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div>
                <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-indigo-50 text-indigo-600 border border-indigo-100 text-[10px] font-black rounded-lg uppercase tracking-widest shadow-sm mb-2">
                    <i class="fas fa-terminal"></i> UCEST105 Lab Companion
                </span>
                <h1 class="text-3xl md:text-4xl font-black text-slate-900 tracking-tight">
                    Python <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">Online Compiler</span>
                </h1>
            </div>

            <!-- Engine Loading Status Badge -->
            <div id="status-badge" class="inline-flex items-center gap-2 px-4 py-2 bg-amber-50 border border-amber-200 text-amber-700 text-xs font-bold rounded-2xl shadow-sm self-start md:self-auto">
                <i class="fas fa-circle-notch fa-spin text-amber-500"></i>
                <span>Initializing Python Engine...</span>
            </div>
        </div>

        <!-- Mobile Tab Toggle (Hidden on Desktop lg:hidden) -->
        <div class="flex lg:hidden bg-white/50 backdrop-blur-md p-1.5 rounded-2xl mb-6 shadow-sm border border-slate-200">
            <button onclick="switchTab('editor')" id="tab-editor" class="flex-1 py-2.5 text-sm font-bold rounded-xl bg-indigo-600 text-white shadow-sm transition-all flex items-center justify-center gap-2">
                <i class="fas fa-code"></i> main.py
            </button>
            <button onclick="switchTab('output')" id="tab-output" class="flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-2">
                <i class="fas fa-terminal"></i> Output
            </button>
        </div>

        <!-- Editor & Terminal Layout (Half-by-Half on Desktop) -->
        <!-- Note: lg:grid-cols-2 creates the perfect 50/50 split -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full">
            
            <!-- Code Editor Panel -->
            <!-- Classes: Flex on mobile by default, ALWAYS flex on desktop (lg:flex) -->
            <div id="editor-panel" class="flex flex-col lg:flex w-full h-full">
                <div class="real-glass rounded-[2rem] p-4 md:p-6 flex flex-col gap-4 h-full">
                    
                    <!-- Toolbar Controls -->
                    <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-200/60">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-code text-indigo-600"></i>
                            <span class="font-bold text-slate-800 text-sm">main.py</span>
                        </div>

                        <!-- Preset Code Selector -->
                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <select id="preset-selector" onchange="loadPreset(this.value)" class="custom-select bg-white/80 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 pr-8 w-full sm:w-auto cursor-pointer focus:outline-none">
                                <option value="hello">Sample: Hello World</option>
                                <option value="quadratic">Sample: Roots of Quadratic Eq</option>
                                <option value="factorial">Sample: Factorial (Recursion)</option>
                                <option value="input_demo">Sample: User Input Demo</option>
                            </select>
                        </div>
                    </div>

                    <!-- Interactive Code Input -->
                    <textarea id="code-input" class="code-textarea w-full h-[400px] lg:h-[500px] rounded-2xl p-4 text-sm text-slate-800 flex-grow" spellcheck="false" placeholder="# Type your Python code here..."></textarea>

                    <!-- Action Buttons -->
                    <div class="flex items-center justify-between gap-3 pt-2">
                        <button onclick="clearEditor()" class="px-4 py-3 bg-white/80 hover:bg-white text-slate-600 border border-slate-200 text-xs font-bold rounded-xl transition-all shadow-sm">
                            <i class="fas fa-trash-alt md:mr-1"></i> <span class="hidden md:inline">Clear</span>
                        </button>

                        <button id="run-btn" onclick="runPythonCode()" disabled class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white text-sm font-extrabold rounded-xl shadow-[0_4px_15px_rgba(79,70,229,0.3)] transition-all flex items-center gap-2 cursor-pointer disabled:cursor-not-allowed w-full md:w-auto justify-center">
                            <i class="fas fa-play"></i>
                            <span>Run Code</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Terminal Output Panel -->
            <!-- Classes: Hidden on mobile by default, ALWAYS flex on desktop (lg:flex) -->
            <div id="output-panel" class="hidden flex-col lg:flex w-full h-full">
                <div class="dark-terminal rounded-[2rem] p-4 md:p-6 flex flex-col h-full min-h-[400px] lg:min-h-[500px]">
                    
                    <!-- Terminal Header -->
                    <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-4">
                        <div class="flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full bg-rose-500"></div>
                            <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                            <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                            <span class="text-xs font-bold text-slate-400 font-mono ml-2">Console Output</span>
                        </div>

                        <button onclick="clearTerminal()" class="text-slate-400 hover:text-white text-xs font-mono transition-colors">
                            <i class="fas fa-eraser mr-1"></i> Clear
                        </button>
                    </div>

                    <!-- Output Console Stream -->
                    <div id="terminal" class="terminal-output flex-grow text-sm text-emerald-400 overflow-y-auto max-h-[400px] lg:max-h-[550px]">
<span class="text-slate-500">// Terminal output will appear here after clicking "Run Code"...</span>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <footer class="mt-auto border-t border-slate-200/60 bg-white/50 py-8 text-center relative z-10">
        <div class="max-w-3xl mx-auto px-4">
            <h3 class="text-slate-800 font-black text-lg mb-1">Kerala Timetable</h3>
            <p class="text-slate-500 font-medium text-sm">Independent student platform for KTU updates & tools.</p>
        </div>
    </footer>

    <script src="components.js?v=18"></script>
    <script>
        if(typeof loadNavigation === 'function') loadNavigation('', '', false);

        // --- 1. MOBILE TAB SWITCHER ---
        function switchTab(tab) {
            const editorPanel = document.getElementById('editor-panel');
            const outputPanel = document.getElementById('output-panel');
            const tabEditor = document.getElementById('tab-editor');
            const tabOutput = document.getElementById('tab-output');

            if (tab === 'editor') {
                // Show Editor, Hide Output
                editorPanel.classList.remove('hidden');
                editorPanel.classList.add('flex');
                outputPanel.classList.remove('flex');
                outputPanel.classList.add('hidden');
                
                // Update Button Styles
                tabEditor.className = "flex-1 py-2.5 text-sm font-bold rounded-xl bg-indigo-600 text-white shadow-sm transition-all flex items-center justify-center gap-2";
                tabOutput.className = "flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-2";
            } else {
                // Hide Editor, Show Output
                editorPanel.classList.remove('flex');
                editorPanel.classList.add('hidden');
                outputPanel.classList.remove('hidden');
                outputPanel.classList.add('flex');
                
                // Update Button Styles
                tabOutput.className = "flex-1 py-2.5 text-sm font-bold rounded-xl bg-slate-800 text-white shadow-sm transition-all flex items-center justify-center gap-2";
                tabEditor.className = "flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-500 hover:text-slate-700 transition-all flex items-center justify-center gap-2";
            }
        }

        // --- 2. PRESET CODE TEMPLATES ---
        const presets = {
            hello: `# KTU UCEST105 - Lab Example\nprint("Welcome to Kerala Timetable Python Compiler!")\n\nfor i in range(1, 6):\n    print(f"Iteration {i}: Python is working on WebAssembly!")`,
            
            quadratic: `# Roots of Quadratic Equation\nimport cmath\n\na = 1\nb = 5\nc = 6\n\nd = (b**2) - (4*a*c)\n\nroot1 = (-b - cmath.sqrt(d)) / (2*a)\nroot2 = (-b + cmath.sqrt(d)) / (2*a)\n\nprint(f"The roots of {a}x² + {b}x + {c} are:")\nprint(f"Root 1: {root1}")\nprint(f"Root 2: {root2}")`,
            
            factorial: `# Recursive Factorial\ndef factorial(n):\n    if n == 1 or n == 0:\n        return 1\n    else:\n        return n * factorial(n - 1)\n\nnum = 5\nprint(f"Factorial of {num} is {factorial(num)}")`,
            
            input_demo: `# Interactive Input Demo\nname = input("Enter your name: ")\nbranch = input("Enter your branch (e.g. CSE): ")\n\nprint(f"\\nHello {name}! Best of luck with your {branch} studies.")`
        };

        document.getElementById('code-input').value = presets.hello;

        function loadPreset(key) {
            if(presets[key]) {
                document.getElementById('code-input').value = presets[key];
            }
        }

        function clearEditor() {
            document.getElementById('code-input').value = '';
        }

        function clearTerminal() {
            document.getElementById('terminal').innerHTML = '<span class="text-slate-500">// Terminal cleared.</span>\n';
        }

        // Handle Tab key inside Textarea for proper indentation
        document.getElementById('code-input').addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });

        // --- 3. PYODIDE ENGINE SETUP ---
        let pyodideInstance = null;

        async function initPyodideEngine() {
            const statusBadge = document.getElementById('status-badge');
            const runBtn = document.getElementById('run-btn');

            try {
                pyodideInstance = await loadPyodide();
                
                pyodideInstance.setStdout({ batched: (str) => appendToTerminal(str, 'stdout') });
                pyodideInstance.setStderr({ batched: (str) => appendToTerminal(str, 'stderr') });

                // Override builtins.input with a JS prompt popup
                await pyodideInstance.runPythonAsync(`
import builtins
import js

def custom_input(prompt_text=""):
    result = js.prompt(prompt_text)
    if result is None:
        raise KeyboardInterrupt("User cancelled input.")
    print(f"{prompt_text}{result}")
    return result

builtins.input = custom_input
                `);

                statusBadge.className = "inline-flex items-center gap-2 px-4 py-2 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-bold rounded-2xl shadow-sm self-start md:self-auto";
                statusBadge.innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i><span>Python Engine Ready</span>';
                runBtn.disabled = false;

            } catch (error) {
                console.error(error);
                statusBadge.className = "inline-flex items-center gap-2 px-4 py-2 bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold rounded-2xl shadow-sm self-start md:self-auto";
                statusBadge.innerHTML = '<i class="fas fa-exclamation-triangle text-rose-500"></i><span>Failed to Load Pyodide</span>';
            }
        }

        function appendToTerminal(str, type = 'stdout') {
            const terminal = document.getElementById('terminal');
            const line = document.createElement('div');
            
            if (type === 'stderr') {
                line.className = 'text-rose-400 font-semibold';
            } else if (type === 'info') {
                line.className = 'text-indigo-300 italic';
            } else {
                line.className = 'text-emerald-400';
            }
            
            line.textContent = str;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function runPythonCode() {
            if (!pyodideInstance) return;

            // Automatically switch to the output tab on mobile devices when run is clicked
            switchTab('output');

            const code = document.getElementById('code-input').value;
            const terminal = document.getElementById('terminal');
            const runBtn = document.getElementById('run-btn');

            terminal.innerHTML = '';
            appendToTerminal("Running script...\n", "info");

            runBtn.disabled = true;
            runBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running...';

            try {
                await pyodideInstance.runPythonAsync(code);
                appendToTerminal("\n[Process finished successfully]", "info");
            } catch (err) {
                appendToTerminal(`\n${err.message}`, "stderr");
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = '<i class="fas fa-play"></i><span>Run Code</span>';
            }
        }

        window.addEventListener('DOMContentLoaded', initPyodideEngine);

        // --- 4. PARALLAX EFFECTS ---
        let lastScrollY = window.scrollY;
        let ticking = false;

        window.addEventListener('scroll', () => {
            lastScrollY = window.scrollY;
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    const scrollBg1 = document.getElementById('scroll-bg-1');
                    const scrollBg2 = document.getElementById('scroll-bg-2');
                    
                    if(scrollBg1) scrollBg1.style.transform = `translateY(${lastScrollY * 0.3}px)`;
                    if(scrollBg2) scrollBg2.style.transform = `translateY(${lastScrollY * -0.2}px)`;
                    ticking = false;
                });
                ticking = true;
            }
        }, { passive: true });

        function applyParallax(x, y) {
            const mouseOrb1 = document.getElementById('mouse-orb-1');
            const mouseOrb2 = document.getElementById('mouse-orb-2');
            
            if(mouseOrb1) mouseOrb1.style.transform = `translate(${x * -30}px, ${y * -30}px)`;
            if(mouseOrb2) mouseOrb2.style.transform = `translate(${x * 40}px, ${y * 40}px)`;
        }

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2; 
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            applyParallax(x, y);
        });

        document.addEventListener('mouseleave', () => applyParallax(0, 0));
    </script>
</body>
</html>
