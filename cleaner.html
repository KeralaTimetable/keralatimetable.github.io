<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KTU PDF Watermark Remover | Kerala Timetable Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/80 rounded-3xl p-6 shadow-2xl backdrop-blur-xl">
        
        <div class="text-center mb-6">
            <span class="inline-block px-3 py-1 rounded-full bg-indigo-500/15 border border-indigo-500/30 text-indigo-400 text-xs font-bold uppercase tracking-wider mb-2">
                Mobile Admin Tool
            </span>
            <h1 class="text-2xl font-black text-white">PDF Re-brander</h1>
            <p class="text-xs text-slate-400 mt-1">
                Removes <code class="text-rose-400">ktunotes</code> watermarks & adds <span class="text-indigo-400 font-bold">Kerala Timetable</span> branding.
            </p>
        </div>

        <form id="cleanForm" onsubmit="handleClean(event)" class="space-y-4">
            
            <!-- Option 1: Paste Link (Saves mobile data) -->
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
                    Option 1: Paste PDF Link
                </label>
                <input type="url" id="pdfUrl" placeholder="https://.../notes.pdf" 
                       class="w-full bg-slate-900/90 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none transition-all">
            </div>

            <div class="flex items-center gap-3 my-2">
                <div class="h-px bg-slate-700 flex-grow"></div>
                <span class="text-[10px] font-bold uppercase text-slate-500">OR</span>
                <div class="h-px bg-slate-700 flex-grow"></div>
            </div>

            <!-- Option 2: Upload from Phone -->
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
                    Option 2: Pick from Phone
                </label>
                <input type="file" id="pdfFile" accept="application/pdf"
                       class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                    class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold py-3.5 px-5 rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 text-sm">
                <i class="fas fa-magic"></i>
                <span id="btnText">Clean &amp; Rebrand PDF</span>
            </button>
        </form>

        <!-- Status Box -->
        <div id="statusBox" class="hidden mt-4 p-3 rounded-xl text-xs font-bold text-center"></div>

    </div>

    <script>
        const API_ENDPOINT = "https://keralatimetable-ktu-papers-api.hf.space/clean-pdf-mobile";

        async function handleClean(e) {
            e.preventDefault();

            const urlInput = document.getElementById('pdfUrl').value.trim();
            const fileInput = document.getElementById('pdfFile').files[0];
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const statusBox = document.getElementById('statusBox');

            if (!urlInput && !fileInput) {
                alert("Please paste a PDF link or choose a file from your phone!");
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = `<i class="fas fa-circle-notch fa-spin mr-1"></i> Processing in Cloud...`;
            statusBox.className = "mt-4 p-3 rounded-xl text-xs font-bold text-center bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 block";
            statusBox.innerText = "16GB Server is stripping old watermarks and adding Kerala Timetable logo...";

            const formData = new FormData();
            if (fileInput) {
                formData.append('file', fileInput);
            }
            if (urlInput) {
                formData.append('url', urlInput);
            }

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("Server returned an error. Check file/link.");
                }

                // Get cleaned blob and download directly onto the phone
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                
                // Get filename from header or default
                let filename = "Cleaned_KeralaTimetable_Notes.pdf";
                const disposition = response.headers.get('content-disposition');
                if (disposition && disposition.includes('filename=')) {
                    filename = disposition.split('filename=')[1].replace(/["']/g, '');
                }
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                statusBox.className = "mt-4 p-3 rounded-xl text-xs font-bold text-center bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 block";
                statusBox.innerText = "✅ Done! Cleaned PDF downloaded to your phone.";
                document.getElementById('cleanForm').reset();
            } catch (err) {
                console.error(err);
                statusBox.className = "mt-4 p-3 rounded-xl text-xs font-bold text-center bg-rose-500/20 text-rose-300 border border-rose-500/30 block";
                statusBox.innerText = "❌ Failed to process PDF. Make sure the link is direct or file is valid.";
            } finally {
                btn.disabled = false;
                btnText.innerText = "Clean & Rebrand PDF";
            }
        }
    </script>
</body>
</html>
